name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  analyze-and-test:
    # Pinned to Windows on purpose: the PNG golden in test/goldens/ is generated
    # on Windows and is sensitive to the Flutter/Skia version.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Errors fail the build. Warnings and infos are reported but tolerated
        # until the lint ratchet (task A4) brings them to zero.
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Regenerate code and verify the working tree is unchanged
        # Generated freezed/json code must be committed and in sync with the models.
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code
